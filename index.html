<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>PHDU MedCore</title>


    <!-- ==================================================
         IOS HOME SCREEN ICON
    =================================================== -->

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="apple-touch-icon.png"
    >


    <!-- ==================================================
         STANDARD FAVICONS
    =================================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="icon-512.png"
    >


    <!-- ==================================================
         WEB APP MANIFEST
    =================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- ==================================================
         IOS WEB APP
    =================================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="PHDU MedCore"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >


    <!-- ==================================================
         THEME
    =================================================== -->

    <meta
        name="theme-color"
        content="#031826"
    >


    <!-- ==================================================
         LIGHTWEIGHT LAUNCHER
    =================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #031826;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                calc(28px + env(safe-area-inset-top))
                22px
                calc(28px + env(safe-area-inset-bottom));

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #launcher {

            width: 100%;

            max-width: 520px;

            text-align: center;

        }


        #appIcon {

            display: block;

            width: 220px;
            height: 220px;

            margin:
                0 auto
                26px;

            border-radius: 42px;

            object-fit: contain;

        }


        #title {

            margin: 0;

            color: #FFFFFF;

            font-size: 42px;

            font-weight: 900;

            line-height: 1.1;

        }


        #subtitle {

            margin:
                14px 0
                32px;

            color: #BFEAFF;

            font-size: 22px;

            font-weight: 700;

            line-height: 1.4;

        }


        #openMedCoreButton {

            width: 100%;

            min-height: 86px;

            padding:
                18px
                24px;

            border: 0;

            border-radius: 24px;

            background:
                linear-gradient(
                    180deg,
                    #62E4FF 0%,
                    #1CB6E8 100%
                );

            color: #04243A;

            font-size: 28px;

            font-weight: 900;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

        }


        #openMedCoreButton:active {

            transform: scale(0.98);

        }


        /* ==================================================
           INSTALL INSTRUCTION
        =================================================== */

        #installHint {

            margin-top: 30px;

            padding:
                24px
                20px;

            border:
                2px solid rgba(98, 228, 255, 0.55);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.06);

        }


        #installHintTitle {

            color: #62E4FF;

            font-size: 26px;

            font-weight: 900;

            line-height: 1.2;

            text-transform: uppercase;

        }


        #installHintMain {

            margin-top: 14px;

            color: #FFFFFF;

            font-size: 23px;

            font-weight: 800;

            line-height: 1.4;

        }


        #installHintFinal {

            margin-top: 14px;

            color: #BFEAFF;

            font-size: 21px;

            font-weight: 700;

            line-height: 1.4;

        }


        @media (max-width: 480px) {

            #appIcon {

                width: 200px;
                height: 200px;

            }


            #title {

                font-size: 38px;

            }


            #subtitle {

                font-size: 21px;

            }


            #openMedCoreButton {

                min-height: 82px;

                font-size: 26px;

            }


            #installHint {

                margin-top: 28px;

                padding:
                    22px
                    18px;

            }


            #installHintTitle {

                font-size: 25px;

            }


            #installHintMain {

                font-size: 22px;

            }


            #installHintFinal {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <main id="launcher">


        <img
            id="appIcon"
            src="icon-512.png"
            alt="PHDU MedCore"
            draggable="false"
        >


        <h1 id="title">
            PHDU MedCore
        </h1>


        <div id="subtitle">
            Pediatric Medication & Clinical Reference
        </div>


        <button
            id="openMedCoreButton"
            type="button"
            onclick="openPHDUmedCore()"
        >
            OPEN PHDU MEDCORE
        </button>


        <!-- ==================================================
             HOME SCREEN INSTRUCTION
        =================================================== -->

        <div id="installHint">

            <div id="installHintTitle">
                IMPORTANT — ADD TO HOME SCREEN FIRST
            </div>

            <div id="installHintMain">
                Before tapping OPEN PHDU MEDCORE,
                add this page to your Home Screen.
            </div>

            <div id="installHintFinal">
                Then open PHDU MedCore from the
                new Home Screen icon.
            </div>

        </div>


    </main>


    <script>

        /* ==================================================
           HIDE INSTALL MESSAGE WHEN OPENED
           FROM HOME SCREEN / STANDALONE MODE
        =================================================== */

        const isInstalled =
            window.navigator.standalone === true ||
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches;


        if (isInstalled) {

            const installHint =
                document.getElementById(
                    "installHint"
                );

            if (installHint) {

                installHint.style.display =
                    "none";

            }

        }


        /* ==================================================
           OPEN PHDU MEDCORE
        =================================================== */

        function openPHDUmedCore() {

            window.location.href =
                "https://script.google.com/macros/s/AKfycbwuK9TNt3GQ2D62WbjMTG7I7gPedtwd-IpNCrpvMfOO45TAq8IxwC-iHmRwssoZnjyJ/exec";

        }

    </script>


</body>

</html>
