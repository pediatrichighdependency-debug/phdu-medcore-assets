<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>PHDU MedCore</title>


    <!-- ==================================================
         IOS HOME SCREEN ICON
    =================================================== -->

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="apple-touch-icon.png"
    >


    <!-- ==================================================
         STANDARD FAVICONS
    =================================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="icon-512.png"
    >


    <!-- ==================================================
         WEB APP MANIFEST
    =================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- ==================================================
         IOS WEB APP
    =================================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="PHDU MedCore"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >


    <!-- ==================================================
         THEME
    =================================================== -->

    <meta
        name="theme-color"
        content="#031826"
    >


    <!-- ==================================================
         LIGHTWEIGHT LAUNCHER
    =================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #031826;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                calc(28px + env(safe-area-inset-top))
                22px
                calc(28px + env(safe-area-inset-bottom));

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #launcher {

            width: 100%;

            max-width: 520px;

            text-align: center;

        }


        /* ==================================================
           LIGHTWEIGHT MEDICATION + ECG SIGNATURE
           Isolated splash enhancement: CSS/SVG + local text.
        =================================================== */

        #medcoreSignal {

            width: min(100%, 390px);

            margin:
                0 auto
                22px;

            text-align: center;

            pointer-events: none;

        }


        #signalEyebrow {

            color: #DDBA63;

            font-size: 11px;

            font-weight: 800;

            line-height: 1.2;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.9;

        }


        #medicationDisplay {

            min-height: 34px;

            margin-top: 9px;

            color: #FFFFFF;

            font-size: 22px;

            font-weight: 800;

            line-height: 1.35;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 0 14px rgba(98, 228, 255, 0.22);

        }


        #medicationCursor {

            display: inline-block;

            width: 2px;
            height: 24px;

            margin-left: 3px;

            background: #62E4FF;

            vertical-align: -4px;

            box-shadow:
                0 0 8px rgba(98, 228, 255, 0.75);

            animation:
                medcoreCursorBlink 0.9s steps(1, end) infinite;

        }


        #medcoreEcg {

            display: block;

            width: 100%;
            height: 54px;

            margin-top: 2px;

            overflow: visible;

        }


        .medcoreEcgBase,
        .medcoreEcgPulse {

            fill: none;

            stroke-linecap: round;
            stroke-linejoin: round;

        }


        .medcoreEcgBase {

            stroke: rgba(42, 177, 255, 0.18);

            stroke-width: 2;

        }


        .medcoreEcgPulse {

            stroke: #2AB1FF;

            stroke-width: 3;

            stroke-dasharray: 86 420;
            stroke-dashoffset: 506;

            filter:
                drop-shadow(0 0 4px rgba(42, 177, 255, 0.75));

            animation:
                medcoreEcgTravel 3.2s linear infinite;

        }


        @keyframes medcoreCursorBlink {

            0%,
            48% {
                opacity: 1;
            }

            49%,
            100% {
                opacity: 0;
            }

        }


        @keyframes medcoreEcgTravel {

            to {
                stroke-dashoffset: 0;
            }

        }


        #appIcon {

            display: block;

            width: 220px;
            height: 220px;

            margin:
                0 auto
                26px;

            border-radius: 42px;

            object-fit: contain;

        }


        #title {

            margin: 0;

            color: #FFFFFF;

            font-size: 42px;

            font-weight: 900;

            line-height: 1.1;

        }


        #subtitle {

            margin:
                14px 0
                32px;

            color: #BFEAFF;

            font-size: 22px;

            font-weight: 700;

            line-height: 1.4;

        }


        #openMedCoreButton {

            width: 100%;

            min-height: 86px;

            padding:
                18px
                24px;

            border: 0;

            border-radius: 24px;

            background:
                linear-gradient(
                    180deg,
                    #62E4FF 0%,
                    #1CB6E8 100%
                );

            color: #04243A;

            font-size: 28px;

            font-weight: 900;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

        }


        #openMedCoreButton:active {

            transform: scale(0.98);

        }


        /* ==================================================
           INSTALL INSTRUCTION
        =================================================== */

        #installHint {

            margin-top: 30px;

            padding:
                24px
                20px;

            border:
                2px solid rgba(98, 228, 255, 0.55);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.06);

        }


        #installHintTitle {

            color: #62E4FF;

            font-size: 26px;

            font-weight: 900;

            line-height: 1.2;

            text-transform: uppercase;

        }


        #installHintMain {

            margin-top: 14px;

            color: #FFFFFF;

            font-size: 23px;

            font-weight: 800;

            line-height: 1.4;

        }


        #installHintFinal {

            margin-top: 14px;

            color: #BFEAFF;

            font-size: 21px;

            font-weight: 700;

            line-height: 1.4;

        }


        @media (max-width: 480px) {

            #medcoreSignal {

                margin-bottom: 18px;

            }


            #signalEyebrow {

                font-size: 10px;

                letter-spacing: 2.4px;

            }


            #medicationDisplay {

                min-height: 31px;

                font-size: 20px;

                letter-spacing: 3px;

            }

            #appIcon {

                width: 200px;
                height: 200px;

            }


            #title {

                font-size: 38px;

            }


            #subtitle {

                font-size: 21px;

            }


            #openMedCoreButton {

                min-height: 82px;

                font-size: 26px;

            }


            #installHint {

                margin-top: 28px;

                padding:
                    22px
                    18px;

            }


            #installHintTitle {

                font-size: 25px;

            }


            #installHintMain {

                font-size: 22px;

            }


            #installHintFinal {

                font-size: 20px;

            }

        }


        @media (prefers-reduced-motion: reduce) {

            #medicationCursor,
            .medcoreEcgPulse {

                animation: none;

            }


            #medicationCursor {

                opacity: 1;

            }


            .medcoreEcgPulse {

                stroke-dasharray: none;
                stroke-dashoffset: 0;

            }

        }

    </style>

</head>


<body>


    <main id="launcher">


        <div
            id="medcoreSignal"
            aria-hidden="true"
        >

            <div id="signalEyebrow">
                Pediatric Medication Reference
            </div>

            <div id="medicationDisplay">
                <span id="medicationName">KETAMINE</span><span id="medicationCursor"></span>
            </div>

            <svg
                id="medcoreEcg"
                viewBox="0 0 390 54"
                preserveAspectRatio="none"
                focusable="false"
            >
                <path
                    class="medcoreEcgBase"
                    d="M2 29 H92 L102 29 L110 17 L120 39 L130 29 H156 L164 24 L174 29 L185 29 L194 5 L208 49 L220 29 H244 L253 19 L263 29 H388"
                ></path>
                <path
                    class="medcoreEcgPulse"
                    d="M2 29 H92 L102 29 L110 17 L120 39 L130 29 H156 L164 24 L174 29 L185 29 L194 5 L208 49 L220 29 H244 L253 19 L263 29 H388"
                ></path>
            </svg>

        </div>


        <img
            id="appIcon"
            src="icon-512.png"
            alt="PHDU MedCore"
            draggable="false"
        >


        <h1 id="title">
            PHDU MedCore
        </h1>


        <div id="subtitle">
            Pediatric Medication & Clinical Reference
        </div>


        <button
            id="openMedCoreButton"
            type="button"
            onclick="openPHDUmedCore()"
        >
            OPEN PHDU MEDCORE
        </button>


        <!-- ==================================================
             HOME SCREEN INSTRUCTION
        =================================================== -->

        <div id="installHint">

            <div id="installHintTitle">
                IMPORTANT — ADD TO HOME SCREEN FIRST
            </div>

            <div id="installHintMain">
                Before tapping OPEN PHDU MEDCORE,
                add this page to your Home Screen.
            </div>

            <div id="installHintFinal">
                Then open PHDU MedCore from the
                new Home Screen icon.
            </div>

        </div>


    </main>


    <script>

        /* ==================================================
           HIDE INSTALL MESSAGE WHEN OPENED
           FROM HOME SCREEN / STANDALONE MODE
        =================================================== */

        const isInstalled =
            window.navigator.standalone === true ||
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches;


        if (isInstalled) {

            const installHint =
                document.getElementById(
                    "installHint"
                );

            if (installHint) {

                installHint.style.display =
                    "none";

            }

        }


        /* ==================================================
           LIGHTWEIGHT MEDICATION NAME ROTATION
        =================================================== */

        const medcoreMedicationNames = [
            "KETAMINE",
            "ADRENALINE",
            "ADENOSINE",
            "NALOXONE",
            "FUROSEMIDE"
        ];

        const medcoreMedicationName =
            document.getElementById(
                "medicationName"
            );

        const medcoreReducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

        let medcoreMedicationIndex = 0;
        let medcoreCharacterIndex = 0;
        let medcoreIsDeleting = false;
        let medcoreAnimationTimer = null;


        function scheduleMedcoreMedicationAnimation(
            delay
        ) {

            window.clearTimeout(
                medcoreAnimationTimer
            );

            medcoreAnimationTimer =
                window.setTimeout(
                    animateMedcoreMedicationName,
                    delay
                );

        }


        function animateMedcoreMedicationName() {

            if (
                !medcoreMedicationName ||
                document.hidden ||
                medcoreReducedMotion
            ) {

                return;

            }

            const currentMedication =
                medcoreMedicationNames[
                    medcoreMedicationIndex
                ];

            if (!medcoreIsDeleting) {

                medcoreCharacterIndex += 1;

                medcoreMedicationName.textContent =
                    currentMedication.slice(
                        0,
                        medcoreCharacterIndex
                    );

                if (
                    medcoreCharacterIndex >=
                    currentMedication.length
                ) {

                    medcoreIsDeleting = true;

                    scheduleMedcoreMedicationAnimation(
                        1350
                    );

                    return;

                }

                scheduleMedcoreMedicationAnimation(
                    72
                );

                return;

            }

            medcoreCharacterIndex -= 1;

            medcoreMedicationName.textContent =
                currentMedication.slice(
                    0,
                    medcoreCharacterIndex
                );

            if (medcoreCharacterIndex <= 0) {

                medcoreIsDeleting = false;

                medcoreMedicationIndex =
                    (
                        medcoreMedicationIndex + 1
                    ) % medcoreMedicationNames.length;

                scheduleMedcoreMedicationAnimation(
                    260
                );

                return;

            }

            scheduleMedcoreMedicationAnimation(
                38
            );

        }


        if (
            medcoreMedicationName &&
            !medcoreReducedMotion
        ) {

            medcoreMedicationName.textContent = "";

            scheduleMedcoreMedicationAnimation(
                420
            );

        }


        document.addEventListener(
            "visibilitychange",
            function () {

                if (document.hidden) {

                    window.clearTimeout(
                        medcoreAnimationTimer
                    );

                    return;

                }

                if (!medcoreReducedMotion) {

                    scheduleMedcoreMedicationAnimation(
                        240
                    );

                }

            }
        );


        /* ==================================================
           OPEN PHDU MEDCORE
        =================================================== */

        function openPHDUmedCore() {

            window.location.href =
                "https://script.google.com/macros/s/AKfycbwuK9TNt3GQ2D62WbjMTG7I7gPedtwd-IpNCrpvMfOO45TAq8IxwC-iHmRwssoZnjyJ/exec";

        }

    </script>


</body>

</html>
